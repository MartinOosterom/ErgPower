openapi: 3.0.3
info:
  title: ErgPower API
  version: 0.1.0
  description: >
    Live rowing data from a Concept2 PM5, for a browser dashboard. v1 is read-only: connection status,
    a full current-state snapshot, and a multiplexed Server-Sent Events stream. All physical quantities
    are SI (metres, seconds, watts, Newtons, bpm); pace is seconds per 500 m. Commands
    (connect/disconnect, device scan) and stored-session browsing are deferred to later revisions.
servers:
  - url: /api/v1

tags:
  - name: connection
  - name: live
  - name: dashboards
  - name: export
  - name: analysis
  - name: coach
  - name: index

paths:
  /connection:
    get:
      operationId: getConnection
      summary: Current PM5 connection status.
      tags: [connection]
      responses:
        "200":
          description: Current connection status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConnectionStatus" }

  /live/snapshot:
    get:
      operationId: getLiveSnapshot
      summary: Full current live state, for the initial dashboard render.
      tags: [live]
      responses:
        "200":
          description: Current live snapshot.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LiveSnapshot" }

  /live/stream:
    get:
      operationId: streamLive
      summary: Multiplexed live event stream (Server-Sent Events).
      description: >
        A text/event-stream carrying named events. Each SSE `event:` field is one of
        connection | workout | metrics | stroke | forceCurve | heartbeat, and its `data:` is the JSON
        of the correspondingly-named schema (enumerated by LiveEvent). Clients connect with EventSource
        and dispatch on the event name; on reconnect, re-fetch /live/snapshot to resync.
      tags: [live]
      responses:
        "200":
          description: An open SSE stream (does not terminate until the client disconnects).
          content:
            text/event-stream:
              schema: { $ref: "#/components/schemas/LiveEvent" }

  /sessions:
    get:
      operationId: listSessions
      summary: List stored sessions.
      tags: [source]
      responses:
        "200":
          description: Stored sessions.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SessionSummary" }

  /sessions/index:
    get:
      operationId: getSessionIndex
      summary: Cross-session index — stored sessions with their technique scores, filterable.
      tags: [index]
      parameters:
        - { name: targetType, in: query, required: false, schema: { type: string, enum: [time, distance] }, description: "Only workouts with this target type." }
        - { name: distanceMin, in: query, required: false, schema: { type: number }, description: "Minimum distance (m)." }
        - { name: distanceMax, in: query, required: false, schema: { type: number }, description: "Maximum distance (m)." }
        - { name: from, in: query, required: false, schema: { type: string }, description: "Inclusive lower bound on startedAt (ISO-8601)." }
        - { name: to, in: query, required: false, schema: { type: string }, description: "Inclusive upper bound on startedAt (ISO-8601)." }
      responses:
        "200":
          description: Matching sessions (newest first) with technique scores.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SessionIndexEntry" }

  /trends:
    get:
      operationId: getTrend
      summary: A metric over time across sessions.
      description: >
        Technique-shape metrics (catchGradient, peakPosition, finishPlateau, meanMaxRatio) are comparable
        across any pieces and may span the whole log. Performance metrics (avgPowerW, peakPowerW, distanceM,
        durationS) are only comparable within a workout type — scope them with the filters (e.g. targetType
        + a distance band) so incomparable pieces are not mixed.
      tags: [index]
      parameters:
        - { name: metric, in: query, required: true, schema: { type: string }, description: "catchGradient | peakPosition | finishPlateau | meanMaxRatio | avgPowerW | peakPowerW | distanceM | durationS" }
        - { name: targetType, in: query, required: false, schema: { type: string, enum: [time, distance] } }
        - { name: distanceMin, in: query, required: false, schema: { type: number } }
        - { name: distanceMax, in: query, required: false, schema: { type: number } }
        - { name: from, in: query, required: false, schema: { type: string } }
        - { name: to, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: Trend points, oldest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SessionTrendPoint" }

  /source:
    get:
      operationId: getSource
      summary: The active source feeding the live pipeline.
      tags: [source]
      responses:
        "200":
          description: Current source status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SourceStatus" }
    post:
      operationId: startSource
      summary: Select and start the source (live PM5 or replay a stored session).
      tags: [source]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SourceRequest" }
      responses:
        "200":
          description: The source that was started.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SourceStatus" }
        "400":
          description: Invalid request (e.g. unknown or non-replayable session).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
    delete:
      operationId: stopSource
      summary: Stop the active source.
      tags: [source]
      responses:
        "200":
          description: Source stopped; current status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SourceStatus" }

  /devices:
    get:
      operationId: scanDevices
      summary: Scan for nearby PM5s (for the connect picker).
      tags: [source]
      responses:
        "200":
          description: Nearby PM5s.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DiscoveredDevice" }

  /sessions/{id}/export.fit:
    get:
      operationId: exportSessionFit
      summary: Download a stored session as a Garmin .FIT rowing activity.
      description: >
        Returns the session as a FIT activity file (records, per-split laps, and a rowing session
        summary) for upload to Strava / Garmin Connect / Concept2 Logbook. The controller is
        hand-written (binary streaming), like /live/stream.
      tags: [export]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The session as a FIT activity file.
          content:
            application/vnd.ant.fit:
              schema: { type: string, format: binary }
        "404":
          description: No such session.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /sessions/{id}/analysis:
    get:
      operationId: getSessionAnalysis
      summary: Deterministic technique analysis of a stored session's force curves.
      description: >
        Per-stroke shape features (peak, peak position, catch gradient, finish plateau, hump index…),
        a Kleshnev-grounded scorecard, a mean±band average curve, per-feature drift trends, the
        resampled per-stroke curves (for a heatmap/overlay), and deterministic fault flags. Computed
        locally, no model. `hasCurves=false` when the session has no force-curve data.
      tags: [analysis]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The session's technique analysis.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionAnalysis" }
        "404":
          description: No such session.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /integrations/llm:
    get:
      operationId: getLlmStatus
      summary: Whether an LLM coach provider is configured (so the UI can show the panel).
      tags: [coach]
      responses:
        "200":
          description: LLM coach status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LlmStatus" }

  /sessions/{id}/coach:
    get:
      operationId: getSessionCoach
      summary: LLM coaching for a stored session (only when a provider is configured).
      description: >
        Grounded natural-language technique coaching built from the session's deterministic analysis
        (features + scorecard + flags) and a Kleshnev rubric. Optional — 409 when no provider is
        configured. The model never sees raw curves.
      tags: [coach]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: mode
          in: query
          required: false
          description: >
            single (default) coaches this session alone; progress also grounds the athlete's recent
            same-type history from the cross-session index and narrates improvement over time (falling
            back to single when there is no comparable history).
          schema: { type: string, enum: [single, progress], default: single }
      responses:
        "200":
          description: Coaching text and the model that produced it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CoachResult" }
        "404":
          description: No such session.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "409":
          description: No LLM provider configured.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /dashboards:
    get:
      operationId: listDashboards
      summary: List saved dashboard profiles.
      tags: [dashboards]
      responses:
        "200":
          description: Saved dashboard profiles.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DashboardSummary" }

  /dashboards/{name}:
    parameters:
      - name: name
        in: path
        required: true
        description: Profile name (must be a safe filename — no path separators or "..").
        schema: { type: string }
    get:
      operationId: getDashboard
      summary: Fetch one dashboard profile.
      tags: [dashboards]
      responses:
        "200":
          description: The dashboard profile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dashboard" }
        "404":
          description: No such profile.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
    put:
      operationId: putDashboard
      summary: Create or replace a dashboard profile.
      tags: [dashboards]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DashboardConfig" }
      responses:
        "200":
          description: The stored profile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dashboard" }
        "400":
          description: Invalid profile name.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
    delete:
      operationId: deleteDashboard
      summary: Delete a dashboard profile.
      tags: [dashboards]
      responses:
        "204":
          description: Deleted.
        "404":
          description: No such profile.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

components:
  schemas:
    ConnectionState:
      type: string
      enum: [DISCONNECTED, SEARCHING, CONNECTING, CONNECTED, RECONNECTING]

    DeviceInfo:
      type: object
      properties:
        name: { type: string, description: 'Advertised name, e.g. "PM5 432234859 Row".' }
        serial: { type: string, nullable: true }
        address: { type: string, description: "CoreBluetooth peripheral UUID (per host)." }
      required: [name, address]

    ConnectionStatus:
      type: object
      properties:
        state: { $ref: "#/components/schemas/ConnectionState" }
        device:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/DeviceInfo" }]
        firmware: { type: string, nullable: true, description: "PM5 firmware revision string." }
        profileId: { type: string, nullable: true, description: "Firmware decode profile in use." }
        since: { type: string, format: date-time, description: "When this state was entered." }
      required: [state]

    WorkoutDurationType:
      type: string
      enum: [TIME, DISTANCE, OTHER]

    WorkoutPhase:
      type: string
      enum: [WAITING, ROWING, RESTING, ENDED]

    WorkoutState:
      type: object
      properties:
        type: { type: integer, description: "Raw PM5 workout-type enum." }
        durationType: { $ref: "#/components/schemas/WorkoutDurationType" }
        targetTimeS: { type: number, nullable: true, description: "Fixed-time target (s)." }
        targetDistanceM: { type: integer, nullable: true, description: "Fixed-distance target (m)." }
        phase: { $ref: "#/components/schemas/WorkoutPhase" }
        intervalCount: { type: integer }
      required: [durationType, phase]

    LiveMetrics:
      type: object
      description: Coherent snapshot of the latest values merged across PM5 characteristics.
      properties:
        elapsedTimeS: { type: number }
        distanceM: { type: number }
        powerW: { type: integer }
        paceSecondsPer500: { type: number, description: "Current pace, seconds per 500 m." }
        avgPaceSecondsPer500: { type: number }
        strokeRate: { type: integer, description: "Strokes per minute." }
        heartRateBpm: { type: integer, nullable: true, description: "null = no HR belt." }
        dragFactor: { type: integer }
        timeLeftS: { type: number, nullable: true, description: "Fixed-time pieces." }
        distanceLeftM: { type: number, nullable: true, description: "Fixed-distance pieces." }
        projectedTimeS: { type: number, nullable: true }
        projectedDistanceM: { type: integer, nullable: true }
        totalCalories: { type: integer }
        splitAvgPowerW: { type: integer, nullable: true }
        splitAvgPaceSecondsPer500: { type: number, nullable: true }
      required: [elapsedTimeS, distanceM, powerW, strokeRate]

    StrokeSummary:
      type: object
      properties:
        index: { type: integer, description: "Monotonic stroke index." }
        pmTime: { type: number }
        drivePeakForceN: { type: number }
        avgDriveForceN: { type: number }
        driveTimeS: { type: number }
        powerW: { type: integer }
        strokeDistanceM: { type: number }
      required: [index, pmTime]

    ForceCurve:
      type: object
      properties:
        strokeIndex: { type: integer }
        pmTime: { type: number }
        forcesN:
          type: array
          items: { type: number }
          description: "Ordered drive-force samples, in Newtons."
        peakN: { type: number }
      required: [strokeIndex, forcesN]

    LiveSnapshot:
      type: object
      properties:
        connection: { $ref: "#/components/schemas/ConnectionStatus" }
        workout:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/WorkoutState" }]
        metrics:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/LiveMetrics" }]
        lastStroke:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/StrokeSummary" }]
        lastForceCurve:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/ForceCurve" }]
      required: [connection]

    Heartbeat:
      type: object
      properties:
        t: { type: string, format: date-time }
      required: [t]

    LiveEvent:
      description: >
        Documents the possible SSE payloads. On the wire these are separate named SSE events (see the
        /live/stream description), not a wrapper object; this oneOf enumerates the `data:` payloads.
      oneOf:
        - $ref: "#/components/schemas/ConnectionStatus"
        - $ref: "#/components/schemas/WorkoutState"
        - $ref: "#/components/schemas/LiveMetrics"
        - $ref: "#/components/schemas/StrokeSummary"
        - $ref: "#/components/schemas/ForceCurve"
        - $ref: "#/components/schemas/Heartbeat"

    SessionSummary:
      type: object
      properties:
        id: { type: string, description: "Session folder name." }
        startedAt: { type: string, nullable: true }
        device: { type: string, nullable: true }
        firmware: { type: string, nullable: true }
        distanceM: { type: number, nullable: true }
        strokes: { type: integer, nullable: true }
        durationS: { type: number, nullable: true }
        avgPowerW: { type: integer, nullable: true }
        peakPowerW: { type: integer, nullable: true }
        replayable: { type: boolean, description: "Has raw frames, so it can be replayed." }
      required: [id, replayable]

    SessionIndexEntry:
      type: object
      description: One session's summary plus its cached technique scores, for cross-session comparison.
      properties:
        id: { type: string }
        startedAt: { type: string, nullable: true }
        targetType: { type: string, enum: [time, distance, none], description: "Workout duration type." }
        targetValue: { type: number, nullable: true, description: "Target seconds (time) or metres (distance)." }
        distanceM: { type: number, nullable: true }
        durationS: { type: number, nullable: true }
        avgPowerW: { type: integer, nullable: true }
        peakPowerW: { type: integer, nullable: true }
        hasCurves: { type: boolean, description: "Whether force curves were recorded (so scores exist)." }
        scores:
          type: object
          additionalProperties: { type: number }
          description: "Technique score key → value (catchGradient, peakPosition, finishPlateau, meanMaxRatio)."
        replayable: { type: boolean }
      required: [id, targetType, hasCurves, replayable]

    SessionTrendPoint:
      type: object
      properties:
        sessionId: { type: string }
        startedAt: { type: string, nullable: true }
        value: { type: number }
      required: [sessionId, value]

    SourceType:
      type: string
      enum: [NONE, BLE, REPLAY]

    SourceRequest:
      type: object
      description: >
        Select a source. type=ble connects to a PM5 (optional device name); type=replay plays a stored
        session (sessionId, optional speed multiplier, default 1.0 = real time).
      properties:
        type: { type: string, enum: [ble, replay] }
        device: { type: string, nullable: true }
        sessionId: { type: string, nullable: true }
        speed: { type: number, nullable: true }
      required: [type]

    SourceStatus:
      type: object
      properties:
        sourceType: { $ref: "#/components/schemas/SourceType" }
        connection: { $ref: "#/components/schemas/ConnectionStatus" }
        sessionId: { type: string, nullable: true, description: "The session being replayed, if any." }
      required: [sourceType, connection]

    DiscoveredDevice:
      type: object
      properties:
        name: { type: string }
        address: { type: string }
        rssi: { type: integer, nullable: true }
      required: [name, address]

    DashboardConfig:
      type: object
      additionalProperties: true
      description: >
        Opaque dashboard configuration (widgets + grid layout + per-widget config). The server stores
        and returns it verbatim and does NOT interpret its internals, so the browser's widget model can
        evolve without a contract change.

    DashboardSummary:
      type: object
      properties:
        name: { type: string }
      required: [name]

    Dashboard:
      type: object
      properties:
        name: { type: string }
        config: { $ref: "#/components/schemas/DashboardConfig" }
      required: [name, config]

    SessionAnalysis:
      type: object
      description: Deterministic technique analysis of a session's force curves.
      properties:
        id: { type: string }
        strokes: { type: integer, description: "Strokes analysed (with a force curve)." }
        hasCurves: { type: boolean, description: "False if the session stored no force curves." }
        bins: { type: integer, description: "Resample resolution: points per normalized drive." }
        scorecard:
          type: array
          items: { $ref: "#/components/schemas/ScoreMetric" }
        meanCurve:
          type: array
          description: "Average drive-force curve with a ±1σ band, over normalized drive position."
          items: { $ref: "#/components/schemas/CurveBand" }
        curves:
          type: array
          description: "Each stroke resampled to `bins` force values (N) — for the heatmap / overlay."
          items:
            type: array
            items: { type: number }
        features:
          type: array
          items: { $ref: "#/components/schemas/FeatureStat" }
        trends:
          type: array
          items: { $ref: "#/components/schemas/FeatureTrend" }
        flags:
          type: array
          items: { $ref: "#/components/schemas/TechniqueFlag" }
      required: [id, strokes, hasCurves]

    ScoreMetric:
      type: object
      description: One shape metric scored against a Kleshnev target window.
      properties:
        key: { type: string }
        label: { type: string }
        value: { type: number, nullable: true }
        unit: { type: string }
        targetMin: { type: number, nullable: true }
        targetMax: { type: number, nullable: true }
        pass: { type: boolean, nullable: true }
        note: { type: string, nullable: true }
      required: [key, label]

    CurveBand:
      type: object
      properties:
        x: { type: number, description: "Normalized drive position 0..1." }
        mean: { type: number }
        lower: { type: number }
        upper: { type: number }
      required: [x, mean, lower, upper]

    FeatureStat:
      type: object
      properties:
        key: { type: string }
        label: { type: string }
        unit: { type: string }
        avg: { type: number, nullable: true }
        cv: { type: number, nullable: true, description: "Coefficient of variation (consistency)." }
        min: { type: number, nullable: true }
        max: { type: number, nullable: true }
      required: [key, label]

    FeatureTrend:
      type: object
      properties:
        key: { type: string }
        label: { type: string }
        unit: { type: string }
        points:
          type: array
          items: { $ref: "#/components/schemas/TrendPoint" }
      required: [key, label, points]

    TrendPoint:
      type: object
      properties:
        stroke: { type: integer }
        value: { type: number }
      required: [stroke, value]

    TechniqueFlag:
      type: object
      properties:
        code: { type: string }
        severity: { type: string, enum: [info, warn] }
        message: { type: string }
        count: { type: integer, nullable: true, description: "Strokes affected, where applicable." }
      required: [code, severity, message]

    LlmStatus:
      type: object
      properties:
        configured: { type: boolean, description: "True if an LLM coach provider is set up." }
        provider: { type: string, nullable: true, description: "e.g. ollama | openai | anthropic." }
        model: { type: string, nullable: true }
      required: [configured]

    CoachResult:
      type: object
      properties:
        model: { type: string, description: "The model that produced the coaching." }
        text: { type: string, description: "Natural-language technique coaching." }
      required: [model, text]

    Problem:
      type: object
      description: RFC 7807 problem details.
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
      required: [title, status]
