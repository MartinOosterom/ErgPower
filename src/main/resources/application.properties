spring.application.name=ErgPower

# The REST + SSE API is served under /api/v1 (applied to the API controllers only, see
# ApiRoutingConfig) so the browser dashboard can be served from / on the same origin/port.
# Omit null fields from API responses (optional fields simply absent).
spring.jackson.default-property-inclusion=non_null
# RFC 7807 problem+json for errors (e.g. 400 on an unknown/non-replayable session).
spring.webflux.problemdetails.enabled=true

# --- PM5 capture configuration (ErgPowerBleProperties, all optional; defaults shown) ---
# Device selection: first | name | peripheral-id
ergpower.ble.device.match=first
# ergpower.ble.device.name=PM5 432234859 Row
# Bridge binary: unset uses the bundled per-platform native binary; set to override with a prebuilt one.
# ergpower.ble.bridge.binary=/path/to/ergpower-bridge
ergpower.ble.storage.dir=sessions
ergpower.ble.capture.sample-rate=500ms
ergpower.ble.capture.force-curve=true
# auto-session: open/close a session folder automatically from the PM5 workout state
ergpower.ble.capture.auto-session=true
ergpower.ble.connect.auto-reconnect=true
# firmware profile: auto (detect from 0x0014 + length fingerprint) | current | reference | <profile id>
ergpower.ble.firmware.profile=auto

# --- Spring AI model selection ---
# The AI layer (coach; later the agent) is opt-in: no model is active by default, so the app boots with
# no LLM even with the provider starters on the classpath. Configuring a provider sets chat to it
# (e.g. spring.ai.model.chat=ollama + spring.ai.ollama.*), typically from the git-ignored local config.
spring.ai.model.chat=none
spring.ai.model.embedding=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.image=none
spring.ai.model.moderation=none

# --- Optional LLM coach (Spring AI, disabled by default) ---
# The coach narrates the deterministic technique analysis; it is a pure add-on. With no chat model
# active (spring.ai.model.chat=none, above) nothing about the analysis changes. To enable the "AI Coach"
# panel, point the chat model at a provider — typically in the git-ignored local config below. Examples:
#   spring.ai.model.chat=ollama
#   spring.ai.ollama.base-url=http://localhost:11434
#   spring.ai.ollama.chat.options.model=llama3.1
# or a cloud provider (put the api key in the local file, never here):
#   spring.ai.model.chat=openai
#   spring.ai.openai.api-key=...
#   spring.ai.openai.chat.options.model=gpt-4o-mini
# Optional athlete profile (all fields optional; unset simply omits the derived values). Unlocks
# watts/kg (power ÷ weight), HR zones (from hrMax, else 220−age), and goal-aware coaching framing.
# ergpower.athlete.weightKg=82
# ergpower.athlete.age=35
# ergpower.athlete.hrMax=188
# ergpower.athlete.goal=a 2k test in six weeks

# Language the coach and agent answer in — a natural-language name (e.g. Dutch); unset = English.
# Only the prose is translated; metric names and numbers are kept as given. The agent formats as Markdown.
# ergpower.ai.language=Dutch

# Secrets/overrides from a git-ignored local file (api keys never committed):
spring.config.import=optional:file:./config/ergpower.local.properties
