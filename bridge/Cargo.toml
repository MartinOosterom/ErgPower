[package]
name = "ergpower-bridge"
version = "0.1.0"
edition = "2021"
description = "ErgPower BLE bridge — connects to a Concept2 PM5 over BLE and forwards raw notification frames (cross-platform, via btleplug). Replaces the Python/bleak bridge."
license = "MIT OR Apache-2.0"

[dependencies]
btleplug = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "io-std", "io-util", "sync"] }
futures = "0.3"
uuid = "1"
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[[bin]]
name = "ergpower-bridge"
path = "src/main.rs"

[profile.release]
opt-level = "z"
lto = true
strip = true
